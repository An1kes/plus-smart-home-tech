spring.application.name=analyzer

spring.datasource.url=jdbc:postgresql://localhost:5432/telemetry_analyzer
spring.datasource.username=dbuser
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

bootstrap.servers=localhost:9092
telemetry.kafka.topics.hubs=telemetry.hubs.v1
telemetry.kafka.topics.snapshots=telemetry.snapshots.v1

analyzer.consumer.hubs.group-id=analyzer-hubs-group
analyzer.consumer.snapshots.group-id=analyzer-snapshots-group

grpc.client.hub-router.address=static://127.0.0.1:59090
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true
grpc.client.hub-router.negotiationType=plaintext